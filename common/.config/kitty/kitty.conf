# Common Kitty config (shared across OSs).
# Kitty has no inline comments — keep comments on their own lines.

foreground        #ffffff
background        #000000
enable_audio_bell no
term              xterm-256color
tab_bar_edge      top
font_size         12.0
cursor_shape      block

# Shell integration otherwise forces a beam cursor at the prompt; no-cursor
# keeps cursor_shape above in effect (other integration features stay on).
shell_integration no-cursor

# OS-specific overlay: install.sh deploys linux/.config/kitty/os.conf or
# macos/.config/kitty/os.conf to ~/.config/kitty/os.conf. Last include wins, so os.conf can override anything above (e.g. font_size on macOS).
include os.conf
