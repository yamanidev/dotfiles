# macOS-specific Kitty config.
#
# macOS has no "monospace" alias; Menlo is preinstalled. Swap for JetBrains
# Mono (or any installed font) if you want it identical to Linux.
font_family         Menlo
font_size           14.0
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# macOS-native tab switching (matches Safari/Chrome/iTerm: Cmd+Shift+[ / ]).
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
